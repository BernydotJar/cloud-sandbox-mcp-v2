name: Native macOS desktop bridge
on:
  push:
    branches: ['feat/native-macos-desktop-control']
  pull_request:
    paths:
      - 'mac-host/**'
      - 'src/mcp/**'
      - 'src/services/computer-use-service.ts'
      - '.github/workflows/native-macos-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: node --test mac-host/desktop.node-test.mjs mac-host/autonomy-session.node-test.mjs
      - run: npm run typecheck
      - run: npm run lint
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check JXA file can parse without GUI permissions
        run: |
          /usr/bin/osascript -l JavaScript -e 'ObjC.import("Foundation");' >/dev/null
          node --check mac-host/desktop-policy.mjs
          node --check mac-host/desktop-routes.mjs
          node --check mac-host/desktop.node-test.mjs
          node --test mac-host/desktop.node-test.mjs
